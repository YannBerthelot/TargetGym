# Mirrors the checks CI runs, so a push does not fail on something a commit
# could have caught. Install with: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uses !ENV, which a plain YAML loader cannot build:
        # check the syntax only.
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # The gallery clips are the largest thing tracked here and the
        # generator caps them at 2.6 MB. This leaves headroom for one and
        # blocks the accidental checkpoint or full-length render.
        args: [--maxkb=3072]

  # The locked ruff, the one CI runs: a pinned hook drifts from it, and two
  # versions format some files differently.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen --only-group lint ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        files: ^(src|tests|scripts)/
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --only-group lint ruff format
        language: system
        types_or: [python, pyi, jupyter]

  # Workflow security: unpinned actions, token permissions, script injection.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.33.1
    hooks:
      - id: zizmor
