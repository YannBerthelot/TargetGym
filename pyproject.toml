[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "target-gym"
dynamic = ["version"]  # derived from git tags by hatch-vcs
description = "Reinforcement learning environments for target MDPs: aircraft, process control and industrial systems, with Gymnax and Gymnasium interfaces"
authors = [{ name = "Yann Berthelot", email = "yannberthelot1@gmail.com" }]
readme = "README.md"
license = "MIT"
keywords = [
    "reinforcement-learning",
    "gymnasium",
    "gymnax",
    "jax",
    "process-control",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The upper bound is a tested ceiling, not caution: it is the newest Python the
# dependency set resolves and passes against. CI runs every version in this
# window, so widening it means adding a column to that grid.
requires-python = ">=3.11,<3.15"

dependencies = [
    # gymnax >= 1.0 is required, not merely preferred: the envs implement
    # ``is_terminated`` (0.0.9 dispatches to ``is_terminal`` instead) and their
    # ``step_env`` returns natural termination alone, leaving the time limit to
    # gymnax's six-value step API.
    "gymnax>=1.0.0",
    # Upper bound tracks gymnax: released gymnax 1.0.0 caps gymnasium at <1.2,
    # so a resolver will pick 1.1.x there. gymnax PR #117 raises that to <1.4;
    # once it ships in a release this window applies as written.
    "gymnasium>=1.1,<1.4",
    "jax>=0.6.2",
    "flax>=0.10",
    "chex>=0.1.86",
    "optax>=0.2",
    "numpy>=1.26.1",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8.1",
    "moviepy>=2.2.1",
    # pygame's last release (2.6.1, 2024) ships wheels only through CPython
    # 3.13; on 3.14 it builds from source and its font module comes up broken,
    # which takes every renderer down with it. pygame-ce is the maintained
    # fork of the same code under the same ``import pygame`` namespace, and it
    # does publish 3.14 wheels. Split by version so the interpreters that
    # already work keep the implementation they were tested against.
    "pygame>=2.6.1; python_version < '3.14'",
    "pygame-ce>=2.5.8; python_version >= '3.14'",
    "tqdm>=4.66",
    # MPC baselines. do-mpc 5.1.1 breaks against casadi 3.8 with
    # "module 'casadi.tools' has no attribute 'SX'", hence the upper bound.
    "casadi>=3.7.2,<3.8",
    "do-mpc>=5.1.1,<6",
]

[project.urls]
Homepage = "https://github.com/YannBerthelot/TargetGym"
Repository = "https://github.com/YannBerthelot/TargetGym"

[dependency-groups]
test = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-readme>=1.0.2",
    "pytest-xdist>=3.6",
    "coverage>=7.3.2",
]
lint = [
    "ruff>=0.12.11",
    "black>=25.1.0",
    "mypy>=1.6.1",
]
agent = [
    "stable-baselines3>=2.7.0",
    "tensorboard>=2.20.0",
    # Declared explicitly, though stable-baselines3 already requires it: a
    # [tool.uv.sources] entry only binds to a direct dependency, and the one
    # below routes Linux to the CPU wheel.
    "torch>=2.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "agent" },
    "pre-commit>=3.5.0",
]

# TEMPORARY: released gymnax 1.0.0 pins gymnasium<1.2, which conflicts with
# newer gymnasium. PR #117 relaxing that to <1.4 is now MERGED into gymnax
# main, but no release carries it yet -- PyPI's latest is still 1.0.0 with the
# old pin. So this tracks upstream main rather than a fork, which is a strictly
# better position but still a git dependency.
#
# This table is dev-only metadata — uv strips it from the published wheel, so
# installers of target-gym still see the plain ``gymnax>=1.0.0`` requirement.
# The cost is that the *tested* configuration cannot be reproduced from PyPI
# alone, which is why 1.0 should wait for the release.
#
# REMOVE once gymnax > 1.0.0 is on PyPI, then bump the floor above to it.
[tool.uv.sources]
gymnax = { git = "https://github.com/RobertTLange/gymnax", branch = "main" }

# stable-baselines3 (dev-only, one PPO smoke test) pulls torch, and torch's
# default Linux wheel drags in the whole CUDA runtime -- several GB of
# nvidia-* wheels that a CPU-only CI runner downloads and never uses. The CPU
# build is the same torch for our purposes and a fraction of the size.
#
# Linux only: macOS and Windows torch wheels are CPU-only already and are not
# published on this index, so they keep resolving from PyPI.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# explicit: nothing resolves from here unless it is named above.
explicit = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/target_gym"]

[tool.hatch.build.targets.sdist]
include = ["src/target_gym", "README.md", "LICENSE"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# A deliberately narrow set, chosen so that what it reports is always worth
# acting on: real defects (F -- undefined names, unused imports, f-strings
# without placeholders), syntax and import errors (E4, E9), and import
# ordering (I). Formatting is black's job and is not duplicated here.
#
# Most of ruff's default style rules are off on purpose rather than by
# omission. E741 would rename `I` and `l`, which are moment of inertia and
# length -- the names the physics and the sources use. RUF059 fires on the
# `_, state, _, terminated, _ = step(...)` unpacking that gymnax's six-value
# signature forces at nearly every call site. Enabling either would mean 200+
# suppressions to say nothing.
select = ["F", "E4", "E9", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: closed-loop / multi-seed checks too slow for the default CI run",
]
