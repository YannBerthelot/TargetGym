[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "target-gym"
dynamic = ["version"]  # derived from git tags by hatch-vcs
description = "Reinforcement learning environments for target MDPs: aircraft, process control and industrial systems, with Gymnax and Gymnasium interfaces"
authors = [{ name = "Yann Berthelot", email = "yannberthelot1@gmail.com" }]
readme = "README.md"
license = "MIT"
keywords = [
    "reinforcement-learning",
    "gymnasium",
    "gymnax",
    "jax",
    "process-control",
    "simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The upper bound is a tested ceiling, not caution: it is the newest Python the
# dependency set resolves and passes against. CI runs every version in this
# window, so widening it means adding a column to that grid.
# Upper bound tracks gymnax, not jax.
#
# Every environment here is a gymnax environment. gymnax 1.0.1 (2026-10-18) is
# the first release that installs on 3.14, where it requires jax>=0.8.1 and
# flax>=0.12.3; jaxlib has shipped cp314 wheels since 0.7.1. gymnax declares
# <3.15, so the trigger to raise this bound again is gymnax and jaxlib
# supporting 3.15.
requires-python = ">=3.11,<3.15"

dependencies = [
    # gymnax >= 1.0 is required, not merely preferred: the envs implement
    # ``is_terminated`` (0.0.9 dispatches to ``is_terminal`` instead) and their
    # ``step_env`` returns natural termination alone, leaving the time limit to
    # gymnax's six-value step API. 1.0.1 is the floor because 1.0.0 does not
    # install on Python 3.14, and uv's universal lock ignores that upper bound:
    # with 1.0.0 allowed it locked 1.0.0 and jax 0.6.2, which has no cp314 wheel.
    "gymnax>=1.0.1",
    # gymnax 1.0.1 allows gymnasium <1.4, as this window does.
    #
    # This used to be a git dependency on gymnax main, on the reasoning that the
    # released cap "conflicts with newer gymnasium". Nothing here needs newer
    # gymnasium: the whole suite, fast and slow, passes on gymnax 1.0.0 with
    # gymnasium 1.1.1 from PyPI alone. The pin cost reproducibility to buy
    # nothing, so it is gone.
    "gymnasium>=1.1,<1.4",
    "jax>=0.6.2",
    "flax>=0.10",
    "chex>=0.1.86",
    "optax>=0.2",
    # NumPy 2 and the first releases built for it. Under numpy 1's value-based
    # casting the HVAC expert's clock ran in float64, and its 04:00 warm-up
    # decision flipped against the recorded episodes; the compatibility job
    # tests these floors (2026-11-01).
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2.2",
    "matplotlib>=3.8.4",
    # Used directly by the gallery-clip tooling and the patrol runner. It
    # arrives transitively through matplotlib anyway, but an
    # import in our own code is our own dependency to declare.
    "pillow>=10.0",
    "tqdm>=4.66",
    # gymnax imports six (gymnax/utils/load_mnist.py) without declaring it.
    # python-dateutil brought it in through matplotlib and pandas until
    # dateutil 4.0 dropped it, and from then on a fresh `pip install
    # target-gym` failed at `import target_gym`. Found by the release's
    # installed-package gate on 2026-11-01.
    "six>=1.16",
]

[project.optional-dependencies]
# Videos (moviepy) and the aircraft dashboards (pygame). Both are imported
# only when a frame is drawn or a video written, and ``render_kit.render_extra``
# names this extra when they are missing.
render = [
    "moviepy>=2.2.1",
    # pygame's last release (2.6.1, 2024) ships wheels only through CPython
    # 3.13; on 3.14 it builds from source and its font module comes up broken,
    # which takes every renderer down with it. pygame-ce is the maintained
    # fork of the same code under the same ``import pygame`` namespace, and it
    # does publish 3.14 wheels. Split by version so the interpreters that
    # already work keep the implementation they were tested against.
    "pygame>=2.6.1; python_version < '3.14'",
    "pygame-ce>=2.5.8; python_version >= '3.14'",
]
all = ["target-gym[render]"]

[project.urls]
# PyPI renders these as a labelled sidebar and recognises these key names, so
# "Documentation", "Issues" and "Changelog" get their own icons. Only Homepage
# and Repository were declared, which sent everyone arriving from
# ``pip install`` to the repository root to find the docs themselves.
Homepage = "https://github.com/YannBerthelot/TargetGym"
Documentation = "https://yannberthelot.github.io/TargetGym/"
Repository = "https://github.com/YannBerthelot/TargetGym"
Issues = "https://github.com/YannBerthelot/TargetGym/issues"
Changelog = "https://github.com/YannBerthelot/TargetGym/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-readme>=1.0.2",
    "pytest-xdist>=3.6",
    "coverage>=7.3.2",
    # tests/test_release_workflow.py reads the workflow files.
    "pyyaml>=6.0",
]
lint = [
    "ruff>=0.12.11",
    "black>=25.1.0",
    "mypy>=1.6.1",
]
# Opt-in (``uv sync --group agent``), not part of dev: SB3 brings torch and
# tensorboard, about 550 MB, to every environment and CI job for one smoke
# test, in a JAX project. Kept for that test and for the cross-check against a
# standard implementation that docs/rl-protocol.md section 12 calls for.
agent = [
    "stable-baselines3>=2.7.0",
    "tensorboard>=2.20.0",
    # Declared explicitly, though stable-baselines3 already requires it: a
    # [tool.uv.sources] entry only binds to a direct dependency, and the one
    # below routes Linux to the CPU wheel.
    "torch>=2.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    # The rendering tests need the optional extra.
    "target-gym[all]",
    "pre-commit>=3.5.0",
    # scripts/record_baselines.py sizes its worker pool against available
    # memory: one planner per core exhausted RAM and sent the machine
    # swapping, which looked like CPU contention and is not.
    "psutil>=5.9",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10",
]

[tool.uv.sources]

# stable-baselines3 (the opt-in agent group) pulls torch, and torch's
# default Linux wheel drags in the whole CUDA runtime -- several GB of
# nvidia-* wheels that a CPU-only CI runner downloads and never uses. The CPU
# build is the same torch for our purposes and a fraction of the size.
#
# Linux only: macOS and Windows torch wheels are CPU-only already and are not
# published on this index, so they keep resolving from PyPI.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# explicit: nothing resolves from here unless it is named above.
explicit = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/target_gym"]

[tool.hatch.build.targets.sdist]
include = ["src/target_gym", "README.md", "LICENSE"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# A deliberately narrow set, chosen so that what it reports is always worth
# acting on: real defects (F -- undefined names, unused imports, f-strings
# without placeholders), syntax and import errors (E4, E9), and import
# ordering (I). Formatting is black's job and is not duplicated here.
#
# Most of ruff's default style rules are off on purpose rather than by
# omission. E741 would rename `I` and `l`, which are moment of inertia and
# length -- the names the physics and the sources use. RUF059 fires on the
# `_, state, _, terminated, _ = step(...)` unpacking that gymnax's six-value
# signature forces at nearly every call site. Enabling either would mean 200+
# suppressions to say nothing.
select = ["F", "E4", "E9", "I"]

[tool.mypy]
# No ``python_version`` pin. Pinning it makes mypy parse *every* file it reads
# under that grammar, including the installed stubs of third-party packages --
# and jax's ``numpy/__init__.pyi`` uses PEP 695 type parameter lists, which are
# a syntax error before 3.12. That broke the 3.13 and 3.14 CI jobs while 3.11
# passed. Each matrix job should type-check against the version it runs on.
# Most third-party scientific packages ship no stubs (chex, gymnax, optax,
# tqdm, moviepy). Their absence is not a defect in this code.
ignore_missing_imports = true

# What mypy is asked to guarantee, and what it is not.
#
# The environments and controllers are numeric JAX code. Their state
# dataclasses annotate fields as ``float`` while holding traced ``Array``
# values -- the ordinary flax.struct idiom -- so a whole-tree run reports
# hundreds of Array-vs-float mismatches that are shorthand, not bugs. Fixing
# them means re-annotating every field of every environment, which is a large
# change for no defect caught.
#
# So mypy is enforced where it earns its keep: the plumbing modules, which are
# ordinary Python and where a type error would be a real one. Widening this
# list is welcome; the way to do it is to make a module pass, then add it.
[[tool.mypy.overrides]]
module = [
    "target_gym.registry",
    "target_gym.runners.runners",
]
disallow_untyped_defs = false
warn_return_any = true

[tool.coverage.run]
source = ["target_gym"]
# Nothing is omitted. The tuners and the figure runner are things users run --
# anyone who changes an environment's parameters has invalidated the shipped
# gains and has to retune -- so excluding them would measure a smaller library
# than the one that ships.

[tool.coverage.report]
show_missing = true
# A ratchet: raise it as coverage improves, never lower it to turn a red build
# green. The bar sat at 80 for a long time while nothing ran it, and measuring
# it for the first time gave 65 -- the gate would have failed on contact.
#
# The gaps were all the same shape: user-reachable code with no test at all.
# Sixteen of the eighteen renderers had none (rendering: 32% -> 96%), twelve of
# the sixteen MPC baselines were never constructed (mpc.py: 40% -> 99%), and 28
# of the 46 PID factories were never built (pid.py: 70% -> 89%). 86 leaves a
# point of slack so an unrelated refactor does not fail the build.
#
# The tuners are covered too, by running each for a couple of gradient steps --
# enough to build a loss, differentiate it and apply an update, which is where
# their failures live. What is left is error branches and __main__ guards, where
# a test costs more than it is worth.
#
# CI measures it over the small tier alone (93% on 2026-10-28); the medium
# tests add 1.4 points but run on other interpreters, so moving a test to
# medium takes it out of this number.
fail_under = 89

[tool.pytest.ini_options]
testpaths = ["tests"]
# A plain `pytest` runs the small tier on every core: unmarked tests, in one
# process each, within 60 s. `pytest -m medium`, `-m large` or `-m records` runs
# another tier (a later -m replaces this one), and `-n0` runs serially, which
# --pdb needs. docs/testing.md has the tiers and what goes where.
addopts = "-n auto --dist worksteal --strict-markers -m 'not medium and not large and not records' --durations=15"
markers = [
    "medium: another process, media files, or a compile that needs gigabytes; CI runs these after the small tier",
    "large: closed-loop or multi-seed behaviour that only shows at the scored length; runs on merges to main",
    "records: reads the rows the re-record label writes; CI runs these in the records job",
    "agent: needs the opt-in agent group (stable-baselines3, torch) and skips without it; CI runs these in the agent job",
]
