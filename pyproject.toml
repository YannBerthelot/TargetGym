[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "target-gym"
dynamic = ["version"]  # derived from git tags by hatch-vcs
description = "Reinforcement learning environments for target MDPs: aircraft, process control and industrial systems, with Gymnax and Gymnasium interfaces"
authors = [{ name = "Yann Berthelot", email = "yannberthelot1@gmail.com" }]
readme = "README.md"
license = "MIT"
keywords = [
    "reinforcement-learning",
    "gymnasium",
    "gymnax",
    "jax",
    "process-control",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torch 2.10's triton dependency caps Python at <3.14, and stable-baselines3
# (dev-only) pulls torch — so the ceiling stays here for a consistent dev env.
requires-python = ">=3.11,<3.14"

dependencies = [
    # gymnax >= 1.0 is required, not merely preferred: the envs implement
    # ``is_terminated`` (0.0.9 dispatches to ``is_terminal`` instead) and their
    # ``step_env`` returns natural termination alone, leaving the time limit to
    # gymnax's six-value step API.
    "gymnax>=1.0.0",
    # Upper bound tracks gymnax: released gymnax 1.0.0 caps gymnasium at <1.2,
    # so a resolver will pick 1.1.x there. gymnax PR #117 raises that to <1.4;
    # once it ships in a release this window applies as written.
    "gymnasium>=1.1,<1.4",
    "jax>=0.6.2",
    "flax>=0.10",
    "chex>=0.1.86",
    "optax>=0.2",
    "numpy>=1.26.1",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8.1",
    "moviepy>=2.2.1",
    "pygame>=2.6.1",
    "tqdm>=4.66",
    # MPC baselines. do-mpc 5.1.1 breaks against casadi 3.8 with
    # "module 'casadi.tools' has no attribute 'SX'", hence the upper bound.
    "casadi>=3.7.2,<3.8",
    "do-mpc>=5.1.1,<6",
]

[project.urls]
Homepage = "https://github.com/YannBerthelot/TargetGym"
Repository = "https://github.com/YannBerthelot/TargetGym"

[dependency-groups]
test = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-readme>=1.0.2",
    "coverage>=7.3.2",
]
lint = [
    "ruff>=0.12.11",
    "black>=25.1.0",
    "mypy>=1.6.1",
]
agent = [
    "stable-baselines3>=2.7.0",
    "tensorboard>=2.20.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "agent" },
    "pre-commit>=3.5.0",
]

# TEMPORARY: released gymnax 1.0.0 pins gymnasium<1.2, which conflicts with
# newer gymnasium. gymnax PR #117 (YannBerthelot -> RobertTLange) relaxes that
# to <1.4. Until it merges and a release ships, develop against the PR branch.
# This table is dev-only metadata — uv strips it from the published wheel, so
# installers of target-gym still see the plain ``gymnax>=1.0.0`` requirement.
# REMOVE once gymnax > 1.0.0 is on PyPI, then bump the floor above.
[tool.uv.sources]
gymnax = { git = "https://github.com/YannBerthelot/gymnax", branch = "chore/relax-runtime-pins" }

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/target_gym"]

[tool.hatch.build.targets.sdist]
include = ["src/target_gym", "README.md", "LICENSE"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: closed-loop / multi-seed checks too slow for the default CI run",
]
