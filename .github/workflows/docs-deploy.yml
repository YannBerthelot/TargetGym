# Publishes docs/ to GitHub Pages. Building and checking the site is the `docs`
# job in python-app.yml, which runs on every pull request; this workflow only
# adds the deploy, so a broken link still fails review rather than reaching the
# published site. The build is repeated here rather than shared, because
# passing an artifact between workflows costs more than the minute it takes to
# rebuild.

name: docs-deploy

on:
  push:
    branches: [ "main" ]
  # So the site can be republished without a commit, which is what you want the
  # first time Pages is switched on and after any settings change.
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one deployment at a time. Unlike the CI workflow this does not
# cancel what is in flight: cancelling a half-finished deploy is how a site ends
# up serving a partial build.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.28"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Rendering 21 clips is the bulk of this job: about eight minutes on a
    # developer machine, and a GitHub runner has fewer and slower cores.
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.13"
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      # mkdocstrings imports the package to read its docstrings, so this needs
      # the runtime as well as the docs group.
      run: uv sync --frozen --group dev --group docs

    # The per-environment clips are not in the repository.
    #
    # ``docs/videos`` is a symlink to ``videos/``, and ``.gitignore`` excludes
    # ``videos/**/*.gif`` because the rendered clips run to tens of megabytes.
    # A local ``mkdocs build`` therefore passes on a working tree that happens
    # to have them, and a CI build from a clean checkout would publish 21
    # environment pages with broken images. Rendering them here keeps the
    # repository light and the site correct; only the five gallery mosaics,
    # which the README and the environment index embed, are committed.
    #
    # Headless: pygame needs a dummy video driver and matplotlib a
    # non-interactive backend, or the renderers abort with no display.
    - name: Render the environment clips
      env:
        SDL_VIDEODRIVER: dummy
        MPLBACKEND: Agg
      # One process per environment, not one for all twenty-one.
      #
      # Rendering them in a single process is what the module does by default,
      # and on a runner it dies: each environment compiles its own step_env and
      # XLA keeps those executables and their device buffers alive, so the cost
      # climbs from 9 s per environment for the aircraft to 92 s for the cement
      # kiln, and the job was killed with SIGTERM partway through the nineteenth.
      # A fresh process per environment releases all of it and the total comes
      # in lower despite paying JAX start-up twenty-one times.
      run: |
        envs=$(uv run python -c "from target_gym.registry import REGISTRY; print(' '.join(REGISTRY))")
        for env in $envs; do
          echo "::group::render $env"
          uv run python -m target_gym.runners.runners --only videos --env "$env"
          echo "::endgroup::"
        done

    - name: Build the site
      run: uv run mkdocs build --strict

    - uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
