# A release, by hand, as ~/.claude/RELEASING.md describes it. Each job needs
# the one before it, so the first failure stops the release:
#
#   check    the version is X.Y.Z, its CHANGELOG entry is on main, its tag does
#            not exist, and the commit is main's head (scripts/release_check.py)
#   slow     the large tier and the records check green on this commit: main's
#            CI has run them on every merge, and they run here only if that
#            run is missing or red
#   package  the wheel and sdist built once and checked installed, outside the
#            checkout, on the oldest and newest Python (package.yml)
#   tag      vX.Y.Z on the checked commit; tags come only from this workflow
#   publish  those exact files to PyPI by trusted publishing, from the pypi
#            environment, whose required reviewer approves the upload
#   verify   target-gym==X.Y.Z installed back from PyPI and its documented
#            examples run; a failure opens an issue, and yanking is the
#            owner's call, never this workflow's
#
# The versioned documentation (mike, X.Y aliased latest) joins as a job after
# publish with the 0.7.0 release, which sets mike up.
#
# PyPI's trusted publisher names this file, release.yml, and the pypi
# environment: renaming either stops publishing.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, X.Y.Z, with its "## [X.Y.Z]" CHANGELOG entry on main.
        required: true

permissions:
  contents: read

# One release at a time, and never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.28"

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      green: ${{ steps.slow.outputs.green }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Check the version, its CHANGELOG entry, its tag and the commit
      env:
        VERSION: ${{ inputs.version }}
      run: python3 scripts/release_check.py "$VERSION"
    # A push run of python-app.yml on this commit whose large tests passed.
    # Its records job ran too: the large tests need it.
    - id: slow
      name: Look for a green run of the large tests on this commit
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        green=false
        runs=$(gh api "repos/$REPO/actions/workflows/python-app.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" -q '.workflow_runs[].id')
        for run in $runs; do
          large=$(gh api "repos/$REPO/actions/runs/$run/jobs" -q '.jobs[] | select(.name == "large tests") | .conclusion')
          if [ "$large" = success ]; then green=true; fi
        done
        echo "green=$green" >> "$GITHUB_OUTPUT"
        echo "large tests green on $GITHUB_SHA: $green"

  slow:
    needs: check
    if: needs.check.outputs.green == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      UV_PYTHON: "3.13"
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - run: uv sync --frozen --group dev
    - name: Check every recorded row describes this tree
      run: uv run pytest tests/ -q -n auto -m records
    - name: Run the large closed-loop tests
      run: uv run pytest -q -m "large and not records"

  # Skipped jobs upstream skip every job after them unless it says always().
  package:
    needs: [check, slow]
    if: >-
      always() && needs.check.result == 'success'
      && (needs.slow.result == 'success' || needs.slow.result == 'skipped')
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ inputs.version }}

  tag:
    needs: [check, slow, package]
    if: always() && needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - env:
        VERSION: ${{ inputs.version }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "v$VERSION" -m "TargetGym $VERSION" "$GITHUB_SHA"
        git push origin "v$VERSION"

  # Trusted publishing: PyPI accepts uploads from this workflow in the pypi
  # environment, so no token is stored anywhere. The files are the ones the
  # package job built and checked, not a rebuild.
  publish:
    needs: tag
    if: always() && needs.tag.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
    - run: uv publish --trusted-publishing always

  # What a user installs: target-gym[all]==X.Y.Z from PyPI, in a fresh
  # environment, retried while the index catches up, then the README's and the
  # docs' examples and the quickstart notebook from the tag.
  verify:
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      JAX_PLATFORMS: cpu
      SDL_VIDEODRIVER: dummy
      MPLBACKEND: Agg
    steps:
    - uses: actions/checkout@v4
      with:
        ref: v${{ inputs.version }}
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
    - name: Install the release from PyPI
      env:
        VERSION: ${{ inputs.version }}
      run: |
        cd "$RUNNER_TEMP"
        uv venv --python 3.13 env
        deadline=$((SECONDS + 1200))
        until uv pip install --python env/bin/python --no-cache "target-gym[all]==$VERSION" pytest pytest-xdist pytest-readme; do
          [ "$SECONDS" -lt "$deadline" ] || { echo "target-gym $VERSION is not installable from PyPI after 20 minutes"; exit 1; }
          sleep 30
        done
        echo "$RUNNER_TEMP/env/bin" >> "$GITHUB_PATH"
    - name: Run the documented examples on it
      run: >-
        python -m pytest -q -p no:cacheprovider tests/test_docs.py
        -m "not records" -k "documented_example_runs or colab_notebook"
    - if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        gh issue create --repo "${{ github.repository }}" \
          --title "target-gym $VERSION from PyPI fails its check" \
          --body "The Release workflow published target-gym $VERSION, but installing it from PyPI or running its documented examples failed: $RUN. Whether to yank it is the owner's call."
