# Installs dependencies with uv, checks formatting, and runs the test suite.
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A new push to a branch makes the run already in flight for it obsolete.
# Cancelling it frees the runner immediately, which is what a contributor
# pushing a fixup actually wants -- their new run starts now, not after the
# stale one finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.28"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    # Neither check needs the runtime dependencies, so this job skips the
    # heavy sync entirely and reports in well under a minute.
    - name: Lint with Ruff
      run: uv run --frozen --only-group lint ruff check src/ tests/ scripts/
    - name: Check formatting with Black
      run: uv run --frozen --only-group lint black --check .

  docs:
    # The documentation is generated from the registry, so it can go stale
    # silently: docs/environments.md and the twenty-four per-environment pages
    # are written by scripts, and every count and table in them comes from the
    # code. Nothing checked that until this job existed, and it drifted --
    # pages missing from the nav, links to files outside the docs tree that
    # resolve on GitHub but 404 on the built site, and a hand-typed
    # "eighteen environments" that survived four new environments.
    #
    # Its own job rather than a step on the test matrix: it runs concurrently
    # with the interpreters, so it adds runner minutes but no wall-clock.
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.13"
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      # The generators import every environment, so this needs the runtime as
      # well as the docs group.
      run: uv sync --frozen --group dev --group docs

    - name: Check the generated pages are current
      # The results page, docs/baseline-results.md, is written from the
      # recorded returns and protocol scores rather than the registry, so
      # re-recording without regenerating it would leave the headline stale.
      run: |
        uv run python scripts/generate_env_reference.py --check
        uv run python scripts/generate_env_pages.py --check
        uv run python scripts/generate_baseline_table.py --check

    - name: Check the documentation still describes the code
      run: |
        uv run python scripts/generate_physics_facts.py --check
        uv run python scripts/check_doc_drift.py --check

    - name: Check no environment changed without a version bump
      run: uv run python scripts/stamp_env_versions.py --check

    - name: Build the site
      # --strict turns a dangling link into a failure. Without it the build
      # reported twenty-five warnings and still exited zero.
      run: uv run mkdocs build --strict

  test:
    # Every interpreter in the project's requires-python window. The columns
    # run concurrently, so covering four of them costs runner minutes but not
    # a contributor's wall-clock wait.
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is absent because gymnax does not support it; see the
        # requires-python note in pyproject.toml.
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Restore the XLA compilation cache
      # Profiling found this suite's cost is compiling the plants, not stepping
      # them: reverse-mode through an RK4 aircraft builds a large graph, and one
      # tuner smoke test taking two gradient steps still cost 45 s of it. JAX can
      # persist compiled executables keyed on the computation itself, which makes
      # that a once-per-code-change cost instead of a once-per-push one.
      # Measured locally over the whole fast suite: 217 s cold, 34.5 s warm.
      #
      # The key includes the sources, so a code change starts a fresh entry; the
      # restore-keys prefix still seeds it from the last cache for this
      # interpreter, and any computation that changed simply misses and is
      # recompiled. Entries are keyed internally by jaxpr, backend and JAX
      # version, so a stale one is never wrongly reused.
      uses: actions/cache@v4
      with:
        path: .jax_cache
        key: jax-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/**/*.py', 'uv.lock') }}
        restore-keys: |
          jax-${{ runner.os }}-py${{ matrix.python-version }}-

    - name: Install dependencies
      # --frozen fails loudly if uv.lock is out of date with pyproject.toml,
      # rather than silently resolving something else than what we tested.
      run: uv sync --frozen --group dev

    - name: Type-check the enforced modules
      # One interpreter is enough: what this checks is annotations, which do
      # not vary across versions. The module list lives in the Makefile so CI
      # and a local `make mypy` cannot drift apart.
      if: matrix.python-version == '3.13'
      run: make mypy

    # The small tier, then the medium one: docs/testing.md says what goes where.
    # pyproject.toml's addopts run each on every core with --durations, which
    # keeps the slowest tests visible; tests/conftest.py pins each worker to one
    # compute thread so they do not fight for them. The -m filters are spelled
    # out, rather than left to the default, so a records test never runs here.
    - name: Small tests
      if: matrix.python-version != '3.13'
      run: uv run pytest -q -m "not medium and not large and not records"

    # Medium tests start other processes, write videos, or compile an aircraft
    # planner or tuner, which peaks at 2.5 to 5 GB. Two workers keep two of
    # those inside the runner's 16 GB; four of them at once shut runners down
    # on 2026-10-27.
    - name: Medium tests
      if: matrix.python-version != '3.13'
      run: uv run pytest -q -m "medium and not records" -n 2

    # One column carries the coverage gate, over both tiers: pytest-cov
    # aggregates the xdist workers, and the second step appends to the first.
    - name: Small tests, measuring coverage
      if: matrix.python-version == '3.13'
      run: uv run pytest -q -m "not medium and not large and not records" --cov=target_gym --cov-report= --cov-fail-under=0

    - name: Medium tests, enforcing coverage over both tiers
      if: matrix.python-version == '3.13'
      run: uv run pytest -q -m "medium and not records" -n 2 --cov=target_gym --cov-append

  large-test:
    # Closed-loop contracts that still roll the plant out here: PID beats the
    # best constant action, states stay bounded and physical under extreme
    # actions, the regimes join. Minutes of rollouts that exercise the baselines
    # rather than the environments, so they run on merges to main rather than on
    # every push.
    #
    # The MPC-versus-PID contract used to live here and was most of the bill --
    # profiled, [plane] alone took 836 s of a 19:47 job, and since xdist
    # parallelises across tests rather than within one, that single test set
    # roughly 70% of the wall-clock floor and came close to this job's
    # 30-minute timeout on four slower cores. It is now asserted from
    # src/target_gym/data/baseline_returns.json, recorded by hand with
    # scripts/record_baselines.py and guarded by a fingerprint of the physics,
    # controllers, gains and parameters it was taken against. That moved it into
    # the fast job above, where it runs on every push and across the whole
    # matrix instead of once per merge on one interpreter.
    #
    # One interpreter is enough: what these assert is controller behaviour,
    # which does not vary across Python versions the way an import or a wheel
    # does. The grid above is what covers those.
    #
    # The floor check (test_mpc_does_not_beat_a_measured_floor) briefly brought
    # MPC rollouts back here, and the same thing happened: 52 of the suite's 65
    # core-minutes, and a run killed by this timeout on a four-core runner. It
    # now reads the MPC's cost from src/target_gym/data/protocol_results.json
    # under the same fingerprint, and runs in the fast job; one slow test
    # re-runs the protocol on the pH plant to keep the recording honest.
    #
    # 60 minutes: on 2026-10-28 the job reached 87% at 24 minutes and the old
    # 30-minute limit cancelled it, which reports nothing at all. It runs after
    # a merge, so the limit never holds up a pull request.
    name: large tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.13"

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Restore the XLA compilation cache
      # Profiling found this suite's cost is compiling the plants, not stepping
      # them: reverse-mode through an RK4 aircraft builds a large graph, and one
      # tuner smoke test taking two gradient steps still cost 45 s of it. JAX can
      # persist compiled executables keyed on the computation itself, which makes
      # that a once-per-code-change cost instead of a once-per-push one.
      # Measured locally over the whole fast suite: 217 s cold, 34.5 s warm.
      #
      # The key includes the sources, so a code change starts a fresh entry; the
      # restore-keys prefix still seeds it from the last cache for this
      # interpreter, and any computation that changed simply misses and is
      # recompiled. Entries are keyed internally by jaxpr, backend and JAX
      # version, so a stale one is never wrongly reused.
      uses: actions/cache@v4
      with:
        path: .jax_cache
        key: jax-${{ runner.os }}-py${{ env.UV_PYTHON }}-${{ hashFiles('src/**/*.py', 'uv.lock') }}
        restore-keys: |
          jax-${{ runner.os }}-py${{ env.UV_PYTHON }}-

    - name: Install dependencies
      run: uv sync --frozen --group dev

    - name: Run the large closed-loop tests
      run: uv run pytest -q -m "large and not records"

  records:
    # The checks a `re-record` fixes, apart from the rest of the suite. They
    # fail whenever a change leaves a recorded baseline or protocol row stale,
    # which says nothing about whether the change is right, so a stale record
    # fails this check alone and a failing test job always means a real bug.
    # They read committed JSON: one interpreter is enough, and the one slow
    # check re-runs the protocol on the pH plant in seconds.
    name: records
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --frozen --group dev

    - name: Check every recorded row describes this tree
      run: uv run pytest tests/ -q -n auto --durations=5 -m records

    - name: Say how to fix a stale record
      if: failure()
      run: echo "::error::A recorded baseline or protocol row is stale or missing. Add the re-record label to the pull request to record it on CI, or record it locally as CONTRIBUTING.md describes."
