# Installs dependencies with uv, checks formatting, and runs the test suite.
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Python application

on:
  push:
    # int/amendment3: the full four-interpreter run happens once per merge, on
    # the push (owner, 2026-11-23). Drop it when that branch lands.
    branches: [ "main", "int/amendment3" ]
  pull_request:
    # feat/sensor-noise carries the 0.8.0 plant fixes until their one re-record
    # (docs/proposals/industrial-fixes.md). Drop it when that branch lands.
    # int/amendment3 is the charter rework's integration branch: a pull request
    # into it runs lint, docs and the small tier on Python 3.13 alone, past the
    # stale records (owner, 2026-11-14 and 2026-11-23). Ten task sessions open
    # pull requests there, and four interpreters each was 3 runner hours a push.
    # Drop it when that branch lands.
    branches: [ "main", "feat/sensor-noise", "int/amendment3" ]

permissions:
  contents: read

# A new push to a pull request makes the run already in flight for it
# obsolete: cancelling it frees the runner for the fixup. A push to a branch
# (a merge into int or main) waits its turn instead, because merges an hour
# apart kept cancelling the full run before its medium tier reported
# (2026-11-25). At most one run waits; a newer push replaces it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.28"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    # Neither check needs the runtime dependencies, so this job skips the
    # heavy sync entirely and reports in well under a minute.
    - name: Lint with Ruff
      run: uv run --frozen --only-group lint ruff check src/ tests/ scripts/
    - name: Check formatting with Black
      run: uv run --frozen --only-group lint black --check .

  docs:
    # The documentation is generated from the registry, so it can go stale
    # silently: docs/environments.md and the twenty-four per-environment pages
    # are written by scripts, and every count and table in them comes from the
    # code. Nothing checked that until this job existed, and it drifted --
    # pages missing from the nav, links to files outside the docs tree that
    # resolve on GitHub but 404 on the built site, and a hand-typed
    # "eighteen environments" that survived four new environments.
    #
    # Its own job rather than a step on the test matrix: it runs concurrently
    # with the interpreters, so it adds runner minutes but no wall-clock.
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.13"
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      # The generators import every environment, so this needs the runtime as
      # well as the docs group.
      run: uv sync --frozen --group dev --group docs

    - name: Check the generated pages are current
      # The results page and its charts are not here: docs/hooks.py writes
      # them from the recorded data during the build below, so they cannot
      # go stale and a re-record does not touch them.
      run: |
        uv run python scripts/generate_env_reference.py --check
        uv run python scripts/generate_env_pages.py --check

    - name: Check the documentation still describes the code
      run: |
        uv run python scripts/generate_physics_facts.py --check
        uv run python scripts/check_doc_drift.py --check

    - name: Check no environment changed without a version bump
      run: uv run python scripts/stamp_env_versions.py --check

    - name: Build the site
      # --strict turns a dangling link into a failure. Without it the build
      # reported twenty-five warnings and still exited zero.
      run: uv run mkdocs build --strict

  agent:
    # The README's reinforcement-learning example trains SAC with
    # stable-baselines3, which brings torch: the opt-in agent group, about
    # 550 MB that every other job leaves out. This job installs it and runs the
    # tests marked agent. They skip without the group, so a skip here means the
    # group did not install, and fails the job.
    #
    # Its own job: it runs alongside the interpreters, so it adds runner
    # minutes but no wall-clock. Like them, it waits for the records job.
    name: agent
    needs: records
    # Pull requests into the integration branch run lint and docs only. The full
    # run is its one draft pull request into main, past a stale `records` until
    # the re-record. Drop this condition when that branch lands.
    if: ${{ !cancelled() && github.base_ref != 'feat/sensor-noise' && (needs.records.result == 'success' || github.head_ref == 'feat/sensor-noise') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
      JAX_PLATFORMS: cpu
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Install dependencies
      run: uv sync --frozen --group dev --group agent
    - name: Run the agent tests
      run: |
        set -o pipefail
        uv run pytest -q -n auto -m "agent and not records" -rs | tee "$RUNNER_TEMP/agent.log"
        if grep -q " skipped" "$RUNNER_TEMP/agent.log"; then
          echo "::error::an agent test skipped, so the agent group is not installed"
          exit 1
        fi

  learning:
    # A short PPO run on one task per group (tests/rl/test_learning.py). Ajax
    # needs JAX 0.10 or later, which uv.lock gives Python 3.14 alone. The tests
    # skip without the learning group, so a skip here means it did not install,
    # and fails the job.
    name: learning
    needs: records
    # Pull requests into the integration branch run lint and docs only. The full
    # run is its one draft pull request into main, past a stale `records` until
    # the re-record. Drop this condition when that branch lands.
    if: ${{ !cancelled() && github.base_ref != 'feat/sensor-noise' && (needs.records.result == 'success' || github.head_ref == 'feat/sensor-noise') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.14"
      JAX_PLATFORMS: cpu
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Install dependencies
      run: uv sync --frozen --group dev --group learning
    - name: Run the learning tests
      run: |
        set -o pipefail
        uv run pytest -q -n auto -m "learning and not records" -rs | tee "$RUNNER_TEMP/learning.log"
        if grep -q " skipped" "$RUNNER_TEMP/learning.log"; then
          echo "::error::a learning test skipped, so the learning group is not installed"
          exit 1
        fi

  test:
    # Every interpreter in the project's requires-python window. The columns
    # run concurrently, so covering four of them costs runner minutes but not
    # a contributor's wall-clock wait.
    name: test (py${{ matrix.python-version }}${{ matrix.shard != 0 && format(', {0}/4', matrix.shard) || '' }})
    # A stale record fails the records job alone, in a few minutes, before
    # three interpreters spend their runner minutes on a tree that needs a
    # re-record first.
    needs: records
    # Pull requests into the integration branch run lint and docs only. The full
    # run is its one draft pull request into main, past a stale `records` until
    # the re-record. Drop this condition when that branch lands.
    if: ${{ !cancelled() && github.base_ref != 'feat/sensor-noise' && (needs.records.result == 'success' || github.head_ref == 'feat/sensor-noise' || github.base_ref == 'int/amendment3' || github.ref == 'refs/heads/int/amendment3') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.head_ref == 'feat/sensor-noise' || github.base_ref == 'int/amendment3' || github.ref == 'refs/heads/int/amendment3') && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # Every Python of requires-python. uv.lock puts 3.11 to 3.13 on JAX
        # 0.6.2, the floor, and 3.14 on the newest JAX gymnax allows.
        # A pull request into int/amendment3 runs 3.13 alone, the interpreter
        # that also type-checks and enforces coverage. The push after its merge
        # runs the whole tier on 3.13 and 3.14, the two JAX versions; 3.11 and
        # 3.12 share 3.13's JAX and run the light job below (owner, 2026-11-25).
        python-version: ${{ fromJSON(github.base_ref == 'int/amendment3' && '["3.13"]' || github.ref == 'refs/heads/int/amendment3' && '["3.13", "3.14"]' || '["3.11", "3.12", "3.13", "3.14"]') }}
        # A pull request into int/amendment3 runs its tests in shards on
        # several runners at once (owner, 2026-11-24), and so does the push
        # after a merge, which ran past 60 minutes unsplit (owner, 2026-11-25).
        # Four, balanced by recorded durations (tests/ci_durations.json); 0 is
        # no sharding.
        shard: ${{ fromJSON((github.base_ref == 'int/amendment3' || github.ref == 'refs/heads/int/amendment3') && '[1, 2, 3, 4]' || '[0]') }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      TG_SHARD: ${{ matrix.shard != 0 && format('{0}/4', matrix.shard) || '' }}
      # On the integration branch only, until its one re-record. Every plant
      # compiles from scratch there, and the compiled programs fill a runner on
      # the older JAX, whatever the worker count, so they are freed after each
      # module and memory and disk are logged. These two examples compare with
      # records that are stale until then, so they would stop the medium tier
      # and the cache. Drop all of this when that branch lands, with the timeout
      # above and the job's `if`.
      FREE_COMPILED_PROGRAMS: ${{ (github.head_ref == 'feat/sensor-noise' || github.base_ref == 'int/amendment3' || github.ref == 'refs/heads/int/amendment3') && '1' || '' }}
      INTEGRATION_ARGS: ${{ (github.head_ref == 'feat/sensor-noise' || github.base_ref == 'int/amendment3' || github.ref == 'refs/heads/int/amendment3') && '-n 2 --deselect=tests/test_docs.py::test_documented_example_runs[docs/using-the-pids.md:2] --deselect=tests/test_docs.py::test_documented_example_runs[docs/using-the-pids.md:6]' || '' }}

    steps:
    - uses: actions/checkout@v4
      with:
        # Two commits: a pull request's merge commit and its first parent, the
        # base it is read against by scripts/ci_select_tests.py.
        fetch-depth: 2

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Restore the XLA compilation cache
      # Profiling found this suite's cost is compiling the plants, not stepping
      # them: reverse-mode through an RK4 aircraft builds a large graph, and one
      # tuner smoke test taking two gradient steps still cost 45 s of it. JAX can
      # persist compiled executables keyed on the computation itself, which makes
      # that a once-per-code-change cost instead of a once-per-push one.
      # Measured locally over the whole fast suite: 217 s cold, 34.5 s warm.
      #
      # The key includes the sources, so a code change starts a fresh entry; the
      # restore-keys prefix still seeds it from the last cache for this
      # interpreter, and any computation that changed simply misses and is
      # recompiled. Entries are keyed internally by jaxpr, backend and JAX
      # version, so a stale one is never wrongly reused.
      #
      # One entry per shard: three shards on one key left two unable to save
      # it. Only a push saves, and even when a test failed (the last step):
      # 3.11 and 3.14 never passed on the integration branch, so they compiled
      # cold on every push (run 45655952101). A pull request reads the
      # entries its base branch saved.
      uses: actions/cache/restore@v4
      with:
        path: .jax_cache
        key: jax-${{ runner.os }}-py${{ matrix.python-version }}-s${{ matrix.shard }}-${{ hashFiles('src/**/*.py', 'uv.lock') }}
        restore-keys: |
          jax-${{ runner.os }}-py${{ matrix.python-version }}-s${{ matrix.shard }}-
          jax-${{ runner.os }}-py${{ matrix.python-version }}-

    - name: Install dependencies
      # --frozen fails loudly if uv.lock is out of date with pyproject.toml,
      # rather than silently resolving something else than what we tested.
      run: uv sync --frozen --group dev

    - name: Type-check the enforced modules
      # One interpreter is enough: what this checks is annotations, which do
      # not vary across versions. The module list lives in the Makefile so CI
      # and a local `make mypy` cannot drift apart.
      if: matrix.python-version == '3.13'
      run: make mypy

    # docs/testing.md says which tier a test belongs in. pyproject.toml's
    # addopts run each on every core with --durations, which keeps the slowest
    # tests visible; tests/conftest.py pins each worker to one compute thread so
    # they do not fight for them. The -m filters are spelled out, rather than
    # left to the default, so a records test never runs here.
    - name: Small tests
      if: matrix.python-version != '3.13'
      run: |
        if [ -n "$INTEGRATION_ARGS" ]; then ( while sleep 60; do echo "[watch] $(free -m | awk 'NR==2{print "used",$3,"avail",$7}') disk $(df -m . | awk 'NR==2{print $4}') cache $(du -sm .jax_cache | cut -f1) rss $(ps -eo rss= --sort=-rss | head -3 | awk '{printf "%d ", $1/1024}') in $(cat .jax_cache/current-test-* 2>/dev/null | tr '\n' ' ')"; done ) & fi
        uv run pytest -q -n auto -m "not medium and not large and not records and not solo" --durations=0 --durations-min=3 $INTEGRATION_ARGS

    # One column carries the coverage gate, over the small tier (93% on
    # 2026-10-28, without the medium tests' 1.4 points). pytest-cov aggregates
    # the xdist workers. sysmon is coverage's low-overhead tracer on Python
    # 3.12 and later, and measures the same lines.
    - name: Small tests, enforcing coverage
      if: matrix.python-version == '3.13' && github.base_ref != 'int/amendment3'
      env:
        COVERAGE_CORE: sysmon
      run: |
        if [ -n "$INTEGRATION_ARGS" ]; then ( while sleep 60; do echo "[watch] $(free -m | awk 'NR==2{print "used",$3,"avail",$7}') disk $(df -m . | awk 'NR==2{print $4}') cache $(du -sm .jax_cache | cut -f1) rss $(ps -eo rss= --sort=-rss | head -3 | awk '{printf "%d ", $1/1024}') in $(cat .jax_cache/current-test-* 2>/dev/null | tr '\n' ' ')"; done ) & fi
        uv run pytest -q -n auto -m "not medium and not large and not records and not solo" --cov=target_gym ${{ matrix.shard != 0 && '--cov-fail-under=0' || '' }} --durations=0 --durations-min=3 $INTEGRATION_ARGS
        if [ "${{ matrix.shard }}" != "0" ]; then mv .coverage "coverage-${{ matrix.shard }}.data"; fi

    # A shard covers a third of the tests, so its coverage is gated once, in
    # 'tests pass', over the three shards' data combined.
    - name: Keep this shard's coverage
      if: matrix.python-version == '3.13' && github.base_ref != 'int/amendment3' && matrix.shard != 0
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.shard }}
        path: coverage-${{ matrix.shard }}.data
        include-hidden-files: true

    # Owner's rule of 2026-11-24: a pull request into the integration branch
    # runs the test folders of the tasks it changes, the test files it changes
    # and the cross-task files. scripts/ci_select_tests.py says which, and runs
    # the whole tier where a change can reach every task or is not recognised.
    # The whole tier with its coverage gate runs on the push after the merge.
    - name: Tests the change selects
      if: github.base_ref == 'int/amendment3'
      run: |
        if [ -n "$INTEGRATION_ARGS" ]; then ( while sleep 60; do echo "[watch] $(free -m | awk 'NR==2{print "used",$3,"avail",$7}') disk $(df -m . | awk 'NR==2{print $4}') cache $(du -sm .jax_cache | cut -f1) rss $(ps -eo rss= --sort=-rss | head -3 | awk '{printf "%d ", $1/1024}') in $(cat .jax_cache/current-test-* 2>/dev/null | tr '\n' ' ')"; done ) & fi
        uv run python scripts/ci_select_tests.py --base HEAD^1 -- -q -n auto -m "not medium and not large and not records and not solo" $INTEGRATION_ARGS

    # A small test whose compile fills a runner by itself (marked solo) runs
    # alone on one worker, after the rest (owner, 2026-11-25). Each shard runs
    # its own share of them: together they take too long for one runner.
    - name: Solo tests
      # Exit code 5 is "no tests collected": a shard may hold none of them.
      run: uv run pytest -q -n 0 -m "solo and not medium and not large and not records" || test $? -eq 5

    - name: Save the XLA compilation cache
      if: always() && github.event_name == 'push'
      uses: actions/cache/save@v4
      with:
        path: .jax_cache
        key: jax-${{ runner.os }}-py${{ matrix.python-version }}-s${{ matrix.shard }}-${{ hashFiles('src/**/*.py', 'uv.lock') }}

  medium:
    # The medium tier, in jobs of its own beside the small tier rather than
    # after it on the same runner, where it put py3.11's shards at 53 to 59 of
    # their 60 minutes (owner, 2026-11-25). The two JAX versions run it: 3.13
    # (the floor's, which 3.11 and 3.12 share) and 3.14 (the newest).
    name: medium (py${{ matrix.python-version }}${{ matrix.shard != 0 && format(', {0}/3', matrix.shard) || '' }})
    needs: records
    # Not on a pull request into the integration branch, which runs the small
    # tests its change selects; on the push after the merge instead.
    if: ${{ !cancelled() && github.base_ref != 'feat/sensor-noise' && github.base_ref != 'int/amendment3' && (needs.records.result == 'success' || github.head_ref == 'feat/sensor-noise' || github.ref == 'refs/heads/int/amendment3') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        shard: ${{ fromJSON(github.ref == 'refs/heads/int/amendment3' && '[1, 2, 3]' || '[0]') }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      TG_SHARD: ${{ matrix.shard != 0 && format('{0}/3', matrix.shard) || '' }}
      JAX_PLATFORMS: cpu
      # As in the test job, until the integration branch lands.
      FREE_COMPILED_PROGRAMS: ${{ (github.head_ref == 'feat/sensor-noise' || github.ref == 'refs/heads/int/amendment3') && '1' || '' }}

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Restore the XLA compilation cache
      # As in the test job: one entry per shard, saved by every push.
      uses: actions/cache/restore@v4
      with:
        path: .jax_cache
        key: jax-${{ runner.os }}-py${{ matrix.python-version }}-medium-s${{ matrix.shard }}-${{ hashFiles('src/**/*.py', 'uv.lock') }}
        restore-keys: |
          jax-${{ runner.os }}-py${{ matrix.python-version }}-medium-s${{ matrix.shard }}-
          jax-${{ runner.os }}-py${{ matrix.python-version }}-medium-

    - name: Install dependencies
      run: uv sync --frozen --group dev

    # Medium tests start other processes, write videos, or compile an aircraft
    # planner or tuner, which peaks at 2.5 to 5 GB. Two workers keep two of
    # those inside the runner's 16 GB; four of them at once shut runners down
    # on 2026-10-27. The oldest and the newest Python run them, which are also
    # the oldest and the newest JAX. After the small tier with coverage, they
    # would put the 3.13 column past ten minutes whenever the compile cache
    # misses (14.5 minutes on 2026-10-28).
    #
    # A medium test whose compile fills most of the runner (solo, see
    # FILLS_A_RUNNER in tests/conftest.py) runs after the rest, on one worker:
    # two of them at once shut down three shards of push run 45655952101.
    - name: Medium tests
      run: |
        uv run pytest -q -m "medium and not solo and not records" -n 2 --durations=0 --durations-min=3
        uv run pytest -q -m "medium and solo and not records" -n 0 || test $? -eq 5

    - name: Save the XLA compilation cache
      if: always() && github.event_name == 'push'
      uses: actions/cache/save@v4
      with:
        path: .jax_cache
        key: jax-${{ runner.os }}-py${{ matrix.python-version }}-medium-s${{ matrix.shard }}-${{ hashFiles('src/**/*.py', 'uv.lock') }}

  light:
    # 3.11 and 3.12 resolve the same JAX as 3.13, which runs the whole tier, so
    # what they can break alone is the interpreter: they import every test
    # module, run the documented examples and the public API, and reset and
    # step every task (owner, 2026-11-25). On the push to the integration
    # branch; elsewhere the test job still runs all four interpreters.
    name: light (py${{ matrix.python-version }})
    needs: records
    if: ${{ !cancelled() && github.ref == 'refs/heads/int/amendment3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      JAX_PLATFORMS: cpu
      FREE_COMPILED_PROGRAMS: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Restore the XLA compilation cache
      uses: actions/cache/restore@v4
      with:
        path: .jax_cache
        key: jax-${{ runner.os }}-py${{ matrix.python-version }}-light-${{ hashFiles('src/**/*.py', 'uv.lock') }}
        restore-keys: |
          jax-${{ runner.os }}-py${{ matrix.python-version }}-light-

    - name: Install dependencies
      run: uv sync --frozen --group dev

    - name: Import every test module
      run: uv run pytest --collect-only -q -m "not records" | tail -3

    - name: Light tests
      # The two using-the-pids examples compare with records that are stale on
      # the integration branch, as in the test job.
      run: >-
        uv run pytest -q -n 2
        -m "not medium and not large and not records and not solo"
        tests/test_docs.py tests/test_public_api.py tests/test_env_conformance.py
        -k "not test_env_conformance or test_step_env_is_jittable"
        --deselect=tests/test_docs.py::test_documented_example_runs[docs/using-the-pids.md:2]
        --deselect=tests/test_docs.py::test_documented_example_runs[docs/using-the-pids.md:6]

    - name: Save the XLA compilation cache
      if: always() && github.event_name == 'push'
      uses: actions/cache/save@v4
      with:
        path: .jax_cache
        key: jax-${{ runner.os }}-py${{ matrix.python-version }}-light-${{ hashFiles('src/**/*.py', 'uv.lock') }}

  tests-pass:
    # The one check the integration branch requires: every shard of the test,
    # medium and light jobs passed. Their names change with the matrix; this
    # one does not. A pull request into the branch runs neither the medium nor
    # the light job.
    name: tests pass
    needs: [test, medium, light]
    if: ${{ always() && (github.base_ref == 'int/amendment3' || github.ref == 'refs/heads/int/amendment3') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - run: |
        test "${{ needs.test.result }}" = "success"
        for result in "${{ needs.medium.result }}" "${{ needs.light.result }}"; do
          # An explicit exit: bash -e ignores a failure inside an || list,
          # and the loop's last test would decide the step's result.
          test "$result" = "success" || { test "$result" = "skipped" && test "${{ github.event_name }}" = "pull_request"; } || exit 1
        done
    # The push's shards each kept their coverage; the floor in
    # pyproject.toml is enforced here, over all of them.
    - uses: actions/checkout@v4
      if: github.ref == 'refs/heads/int/amendment3'
    - uses: astral-sh/setup-uv@v5
      if: github.ref == 'refs/heads/int/amendment3'
      with:
        version: ${{ env.UV_VERSION }}
    - uses: actions/download-artifact@v4
      if: github.ref == 'refs/heads/int/amendment3'
      with:
        pattern: coverage-*
        merge-multiple: true
    - name: Coverage over the shards
      if: github.ref == 'refs/heads/int/amendment3'
      env:
        UV_PYTHON: "3.13"
      run: |
        uv sync --frozen --group dev
        uv run coverage combine coverage-*.data
        uv run coverage report

  large-test:
    # Closed-loop contracts that still roll the plant out here: PID beats the
    # best constant action, states stay bounded and physical under extreme
    # actions, the regimes join. Minutes of rollouts that exercise the baselines
    # rather than the environments, so they run on merges to main rather than on
    # every push.
    #
    # The MPC-versus-PID contract used to live here and was most of the bill --
    # profiled, [plane] alone took 836 s of a 19:47 job, and since xdist
    # parallelises across tests rather than within one, that single test set
    # roughly 70% of the wall-clock floor and came close to this job's
    # 30-minute timeout on four slower cores. It is now asserted from
    # src/target_gym/data/baseline_returns.json, recorded by hand with
    # scripts/record_baselines.py and guarded by a fingerprint of the physics,
    # controllers, gains and parameters it was taken against. That moved it into
    # the fast job above, where it runs on every push and across the whole
    # matrix instead of once per merge on one interpreter.
    #
    # One interpreter is enough: what these assert is controller behaviour,
    # which does not vary across Python versions the way an import or a wheel
    # does. The grid above is what covers those.
    #
    # The floor check (test_mpc_does_not_beat_a_measured_floor) briefly brought
    # MPC rollouts back here, and the same thing happened: 52 of the suite's 65
    # core-minutes, and a run killed by this timeout on a four-core runner. It
    # now reads the MPC's cost from src/target_gym/data/protocol_results.json
    # under the same fingerprint, and runs in the fast job; one slow test
    # re-runs the protocol on the pH plant to keep the recording honest.
    #
    # 60 minutes: on 2026-10-28 the job reached 87% at 24 minutes and the old
    # 30-minute limit cancelled it, which reports nothing at all. It runs after
    # a merge, so the limit never holds up a pull request.
    name: large tests
    needs: records
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.records.result == 'success') || github.head_ref == 'feat/sensor-noise') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.head_ref == 'feat/sensor-noise' && 120 || 60 }}
    env:
      UV_PYTHON: "3.13"
      # The 0.8.0 integration branch's plants compile about 3.4 GB per process, and
      # four workers ended this job mid-run with no failure to read. Gone when the
      # branch lands, with the same exceptions in the small tier.
      FREE_COMPILED_PROGRAMS: ${{ github.head_ref == 'feat/sensor-noise' && '1' || '' }}
      INTEGRATION_ARGS: ${{ github.head_ref == 'feat/sensor-noise' && '-n 2' || '' }}

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Restore the XLA compilation cache
      # Profiling found this suite's cost is compiling the plants, not stepping
      # them: reverse-mode through an RK4 aircraft builds a large graph, and one
      # tuner smoke test taking two gradient steps still cost 45 s of it. JAX can
      # persist compiled executables keyed on the computation itself, which makes
      # that a once-per-code-change cost instead of a once-per-push one.
      # Measured locally over the whole fast suite: 217 s cold, 34.5 s warm.
      #
      # The key includes the sources, so a code change starts a fresh entry; the
      # restore-keys prefix still seeds it from the last cache for this
      # interpreter, and any computation that changed simply misses and is
      # recompiled. Entries are keyed internally by jaxpr, backend and JAX
      # version, so a stale one is never wrongly reused.
      uses: actions/cache@v4
      with:
        path: .jax_cache
        key: jax-${{ runner.os }}-py${{ env.UV_PYTHON }}-${{ hashFiles('src/**/*.py', 'uv.lock') }}
        restore-keys: |
          jax-${{ runner.os }}-py${{ env.UV_PYTHON }}-

    - name: Install dependencies
      run: uv sync --frozen --group dev

    - name: Run the large closed-loop tests
      run: |
        if [ -n "$INTEGRATION_ARGS" ]; then ( while sleep 60; do echo "[watch] $(free -m | awk 'NR==2{print "used",$3,"avail",$7}') disk $(df -m . | awk 'NR==2{print $4}') cache $(du -sm .jax_cache | cut -f1)"; done ) & fi
        uv run pytest -q -n auto -m "large and not records" $INTEGRATION_ARGS

  records:
    # The checks a `re-record` fixes, apart from the rest of the suite. They
    # fail whenever a change leaves a recorded baseline or protocol row stale,
    # which says nothing about whether the change is right, so a stale record
    # fails this check alone and a failing test job always means a real bug.
    # They read committed JSON: one interpreter is enough, and the one slow
    # check re-runs the protocol on the pH plant in seconds.
    name: records
    if: ${{ github.base_ref != 'feat/sensor-noise' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --frozen --group dev

    # Each row's expert and oracle parts against their own fingerprints.
    - name: Check every recorded row describes this tree
      run: uv run pytest tests/ -q -n auto --durations=5 -m records

    - name: Say how to fix a stale record
      if: failure()
      run: echo "::error::The expert or oracle part of a recorded baseline or protocol row is stale or missing. Add the re-record label to the pull request to record the stale parts on CI, or record them locally as CONTRIBUTING.md describes."
