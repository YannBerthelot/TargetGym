# Installs dependencies with uv, checks formatting, and runs the test suite.
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A new push to a branch makes the run already in flight for it obsolete.
# Cancelling it frees the runner immediately, which is what a contributor
# pushing a fixup actually wants -- their new run starts now, not after the
# stale one finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.28"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    # Neither check needs the runtime dependencies, so this job skips the
    # heavy sync entirely and reports in well under a minute.
    - name: Lint with Ruff
      run: uv run --frozen --only-group lint ruff check src/ tests/ scripts/
    - name: Check formatting with Black
      run: uv run --frozen --only-group lint black --check .

  test:
    # Every interpreter in the project's requires-python window. The columns
    # run concurrently, so covering four of them costs runner minutes but not
    # a contributor's wall-clock wait.
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      # --frozen fails loudly if uv.lock is out of date with pyproject.toml,
      # rather than silently resolving something else than what we tested.
      run: uv sync --frozen --group dev

    - name: Test with pytest
      # -n auto spreads the suite over the runner's cores; tests/conftest.py
      # pins each worker to one compute thread so they do not fight for them.
      # --durations keeps the slowest tests visible, so the suite's cost stays
      # something we notice rather than something that creeps.
      run: uv run pytest tests/ -q -n auto --durations=10 -m "not slow"

  slow-test:
    # Closed-loop controller contracts: PID beats the best constant action,
    # MPC is at least as good as PID, episodes stay survivable across seeds.
    # Minutes of rollouts that exercise the baselines rather than the
    # environments, so they run on merges to main rather than on every push.
    #
    # One interpreter is enough: what these assert is controller behaviour,
    # which does not vary across Python versions the way an import or a wheel
    # does. The grid above is what covers those.
    name: slow tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.13"

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --frozen --group dev

    - name: Run slow closed-loop tests
      run: uv run pytest tests/ -q -n auto --durations=10 -m "slow"
