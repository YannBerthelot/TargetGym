# Installs dependencies with uv, checks formatting, and runs the test suite.
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pygame

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      # --frozen fails loudly if uv.lock is out of date with pyproject.toml,
      # rather than silently resolving something else than what we tested.
      run: uv sync --frozen --group dev

    - name: Check formatting with Black
      run: uv run black --check .

    - name: Test with pytest
      # `slow` marks the multi-seed closed-loop controller checks; they run in
      # the nightly job below, not on every push.
      env:
        JAX_PLATFORMS: cpu
      run: uv run pytest tests/ -v -m "not slow"

  slow-test:
    # Closed-loop controller contracts (PID beats constant, MPC >= PID,
    # episodes survivable across seeds). Too slow for per-push CI.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pygame

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --frozen --group dev

    - name: Run slow closed-loop tests
      env:
        JAX_PLATFORMS: cpu
      run: uv run pytest tests/ -v -m "slow"
