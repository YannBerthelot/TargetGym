name: Build and Publish

on:
  release:
    types: [published]

permissions:
  contents: write  # required to upload release assets

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so hatch-vcs can derive the version from the
          # release tag. ``fetch-depth: 0`` alone does NOT fetch tags in
          # checkout@v4 (fetch-tags defaults to false).
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"

      - name: Build
        env:
          # Belt-and-suspenders: even with tags fetched, pin the version
          # explicitly to the release tag (stripped of a leading "v") so a
          # detached-HEAD checkout can't produce a ``.devN`` version.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.event.release.tag_name }}
        run: |
          export SETUPTOOLS_SCM_PRETEND_VERSION="${SETUPTOOLS_SCM_PRETEND_VERSION#v}"
          echo "Building version: $SETUPTOOLS_SCM_PRETEND_VERSION"
          # ``uv build`` strips [tool.uv.sources] from the published metadata,
          # so the wheel declares the plain ``gymnax>=1.0.0`` requirement even
          # while development tracks the gymnax PR branch.
          uv build
          ls -la dist/

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish

      - name: Upload release assets with gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
