# Monthly pull requests that refresh uv.lock and the pinned actions.
# pyproject.toml's ranges stay as written: they change by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    groups:
      dependencies:
        patterns: ["*"]
