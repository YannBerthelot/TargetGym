site_name: TargetGym
site_description: >-
  JAX reinforcement learning environments for target MDPs: reach a setpoint and
  hold it, across aircraft, process control and industrial plants.
site_url: https://yannberthelot.github.io/TargetGym/
repo_url: https://github.com/YannBerthelot/TargetGym
repo_name: YannBerthelot/TargetGym
edit_uri: edit/main/docs/
copyright: Copyright &copy; Yann Berthelot

theme:
  name: material
  # The banner on every version but the latest release (overrides/main.html).
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

hooks:
  - docs/hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/results-chart.js

extra_css:
  - stylesheets/results-chart.css

# Design drafts, kept in the repository but not published. The capability
# profile is out of this release (owner, 2026-11-24): its radar is drawn from
# the tracking score, and it returns when it is rebuilt on the saving over the
# reference. Its page stays in the repository, where the tests still run it.
exclude_docs: |
  proposals/
  capability-profile.md

nav:
  - Home: index.md
  - User guide:
      - Getting started: getting-started.md
      - Comparing an agent with the reference: comparing.md
      - Known limits: known-limits.md
      - Continuing tasks: continuing-tasks.md
      - Using the PIDs: using-the-pids.md
      - Rendering: rendering.md
      - Throughput: performance.md
      - API reference: api.md
  - Task cards:
      - tasks/reactor.md
      - tasks/hvac.md
      - tasks/compressor_surge.md
      - tasks/ph_neutralization.md
  - Environments:
      - Overview: environments.md
      - Choosing an environment: complexity.md
      # Environment pages take their nav title from their heading, which
      # scripts/generate_env_pages.py writes from registry.display_name.
      - Aircraft:
          - environments/plane.md
          - environments/plane_sine.md
          - environments/plane_energy.md
          - environments/plane3d_heading.md
          - environments/plane3d_circle.md
          - environments/plane3d_racetrack.md
          - environments/plane3d_figure8.md
          - environments/patrol.md
          - environments/patrol_range_bearing.md
          - environments/formation.md
          - environments/wake_surf.md
          - Multi-agent formation: multi-agent.md
      - Process control:
          - environments/cstr.md
          - environments/first_order.md
          - environments/four_tank.md
          - environments/ph_neutralization.md
          - environments/distillation.md
          - environments/unstable_cstr.md
      - Industrial:
          - environments/glass_furnace.md
          - environments/reactor.md
          - environments/hvac.md
          - environments/cement_kiln.md
          - environments/boiler_drum.md
          - environments/compressor_surge.md
      - Energy:
          - environments/wind_turbine.md
          - environments/battery.md
  - Results:
      - Baseline results: baseline-results.md
      - RL protocol: rl-protocol.md
      - RL results: rl-baselines.md
  - Background:
      - Target MDPs: target-mdp.md
      - How the baselines work: baselines.md
      - Reward shaping: reward-shaping.md
      - Physics methodology: PHYSICS_METHODOLOGY.md
  - Contributing:
      - Testing: testing.md
      - Model review checklist: model-review-checklist.md
      - Functional structure: functional-structure.md
      - Certainty-equivalence study: certainty-equivalence-study.md
      - Roadmap: roadmap.md

# One site version per release, deployed by mike (docs-deploy.yml): X.Y for
# each release, "latest" the newest, "dev" built from main.
extra:
  source_ref: !ENV [TARGETGYM_DOCS_REF, main]
  version:
    provider: mike
    default: latest
    alias: true
